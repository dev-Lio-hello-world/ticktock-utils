[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticktock_utils"
version = "1.1.2"
description = "A tiny and easy-to-use time tool library"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "Lio", email = "asdfghjkl202637@outlook.com" }
]
[project.urls]
Homepage = "https://github.com/dev-lio-hello-world/ticktock-utils"
Repository = "https://github.com/dev-lio-hello-world/ticktock-utils"
Issues = "https://github.com/dev-lio-hello-world/ticktock-utils/issues"
Changelog = "https://github.com/dev-lio-hello-world/ticktock-utils/blob/main/CHANGELOG.md"

# 这里加依赖
dependencies = [
    "lunarcalendar>=0.0.9"
]

[tool.hatch.build.targets.wheel]
packages = ["ticktock_utils"]
